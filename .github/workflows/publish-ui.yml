name: Publish UI package

on:
  push:
    branches:
      - main
    paths:
      - 'packages/ui/**'
      - 'package-lock.json'
      - 'package.json'
  workflow_dispatch:

concurrency:
  group: publish-ui
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        run: |
          npm run typecheck
          npm test

      - name: Increment patch version
        run: npm version patch --workspace=packages/ui --no-git-tag-version

      - name: Build package
        run: npm run build -w packages/ui

      - name: Publish package to npm
        run: npm publish --workspace=packages/ui --access public

      - name: Commit published version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ui/package.json package-lock.json
          git commit -m "chore(ui): publish new package version [skip ci]"
          git push
